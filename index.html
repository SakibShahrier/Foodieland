<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lobster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/7150fbc846.js" crossorigin="anonymous"></script>
    <title>Foodiland</title>
</head>
<body>
    <div class="container">

        <nav>
            <div class="brand">
                <h2 class="brand-name">Foodieland<span>.</span></h2>
            </div>
            <div class="navigations">
                <ul>
                    <li><a href="">Home</a></li>
                    <li><a href="">Recipes</a></li>
                    <li><a href="">Blog</a></li>
                    <li><a href="">Contact</a></li>
                    <li><a href="">About Us</a></li>
                </ul>
            </div>
            <div class="socials navigations">
                <ul>
                    <li><a href=""><i class="fa-brands fa-facebook-f"></i></a></li>
                    <li><a href=""><i class="fa-brands fa-twitter"></i></a></li>
                    <li><a href=""><i class="fa-brands fa-instagram"></i></a></li>
                </ul>
            </div>
        </nav>
        <hr>

        <div class="banner">
            <img class="badge" src="./assets/images/Badge.svg">
            <div class="hero">
                <button class="hot-reciepe">
                    <div>
                        <img src="./assets/images/image 14.svg">
                        <span>Hot Recipes</span>
                    </div>
                </button>
                <h1>Spicy delicious chicken wings</h1>

                <p>Lorem ipsum dolor sit amet, consectetuipisicing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqut enim ad minim </p>

                <div class="banner-buttons">
                    <div class="button-1">
                        <i class="fa-solid fa-stopwatch"></i>
                        <span>30 Minutes</span>
                    </div>
                    <div class="button-2">
                        <i class="fa-solid fa-utensils"></i>
                        <span>Chicken</span>
                    </div>
                </div>
                <div class="details-section">
                    <div class="author">
                        <img src="./assets/images/Ellipse 2.svg">
                        <div class="author-details">
                            <span id="author-name">John Smith</span>
                            <span id="publish-date">15 March 2022</span>
                        </div>
                    </div>
                    <button class="view-reciepe">
                        <span>View Recipes</span>
                        <i class="fa-solid fa-circle-play"></i>
                    </button>
                </div>
            </div>
            <div class="hero-image">
                
            </div>
        </div>

    </div>
    
    
    

</body>
</html>
